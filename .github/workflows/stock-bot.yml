name: Stock Monitor Bot

on:
  schedule:
    # טרום-מסחר: כל שעתיים
    # 08:00, 10:00, 12:00 UTC = 04:00, 06:00, 08:00 שעון ניו יורק (קיץ)
    - cron: '0 8,10,12 * * 1-5'
    # מסחר רגיל: כל שעה
    # 14:00-20:00 UTC = 10:00-16:00 שעון ניו יורק (קיץ)
    - cron: '0 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
